<title>Созвездие</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a living night sky on canvas behind everything; glass score strip, host line and a 5×3 board of glowing tiles; questions rise as a glass sheet */
:root {
  --night: #060918;
  --glass: rgba(22, 27, 64, 0.52);
  --glass-hi: rgba(36, 42, 92, 0.62);
  --glass-solid: #121638;
  --line: rgba(196, 204, 255, 0.14);
  --line-hi: rgba(255, 214, 140, 0.45);
  --fg: #f3efe4;
  --muted: #a9acca;
  --dim: #6c7197;
  --gold: #ffd27d;
  --gold-ink: #2a1b00;
  --firefly: #dcff7e;
  --violet: #ab9dff;
  --rose: #ff9db0;
  --good: #8ff0c2;
  --bad: #ff9191;
  --display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --text: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--night); color: var(--fg); font-family: var(--text); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

.app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; min-height: 100%; display: flex; flex-direction: column; gap: 14px; }
main { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: 0.01em; }
.brand b { color: var(--gold); }
.app.on-start .brand { visibility: hidden; }
.cell, .pts, .wager output, .stat b, .rank, .progress, .final-row, .delta { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }
.toggles { display: flex; gap: 6px; }
.icon-btn { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; color: var(--muted); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.icon-btn[aria-pressed="true"] { color: var(--fg); border-color: var(--line-hi); }

.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }

/* ---------- start ---------- */
.start { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding-block: 20px 40px; }
.start h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.8rem, 12.5vw, 4.6rem); line-height: 0.9; letter-spacing: -0.01em; margin: 0; text-wrap: balance; text-shadow: 0 0 40px rgba(255, 210, 125, 0.35); }
.start h1 span { color: var(--gold); }
.start .kicker { font-size: 0.75rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin: 0; }
.start p { color: var(--muted); max-width: 30rem; margin: 0; text-wrap: balance; }
.lineup { display: flex; gap: 26px; align-items: flex-end; justify-content: center; margin-block: 8px 4px; }
.lineup figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 110px; }
.lineup figcaption { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.lineup figcaption b { display: block; color: var(--fg); font-weight: 800; font-size: 0.85rem; }
.btn { background: linear-gradient(180deg, #ffe0a0, var(--gold)); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 15px 34px; font-family: var(--text); font-weight: 800; font-size: 1rem; letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 0 0 1px rgba(255, 220, 150, 0.5), 0 10px 40px -8px rgba(255, 200, 100, 0.55); transition: transform .2s, box-shadow .2s; }
.btn:hover { box-shadow: 0 0 0 1px rgba(255, 220, 150, 0.7), 0 12px 50px -6px rgba(255, 200, 100, 0.7); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: var(--glass); color: var(--fg); box-shadow: none; border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.best { font-size: 0.85rem; color: var(--dim); font-variant-numeric: tabular-nums; }

/* ---------- scores ---------- */
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.player { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: flex; align-items: center; gap: 6px; min-width: 0; position: relative; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: border-color .4s, box-shadow .4s; }
.player.turn { border-color: var(--line-hi); box-shadow: 0 0 24px -6px rgba(255, 210, 125, 0.45); }
.player .who { min-width: 0; }
.player .name { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .pts { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.player .pts.neg { color: var(--bad); }
.player .delta { position: absolute; right: 8px; top: -10px; font-weight: 800; font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; pointer-events: none; }
.delta.up { background: var(--good); color: #062417; }
.delta.down { background: var(--bad); color: #2d0707; }

/* ---------- host ---------- */
.host { display: flex; align-items: center; gap: 12px; min-height: 66px; }
.bubble { background: var(--glass); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 0.95rem; min-width: 0; flex: 1; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; perspective: 900px; }
.theme { font-size: clamp(0.6rem, 2.3vw, 0.74rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; padding: 4px 2px 6px; display: flex; align-items: flex-end; justify-content: center; min-height: 2.6em; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.cell { aspect-ratio: 1 / 0.8; max-width: 100%; border-radius: 16px; font-family: var(--display); font-weight: 700; font-size: clamp(1.2rem, 5.2vw, 1.75rem); color: var(--gold); cursor: pointer; font-variant-numeric: tabular-nums; position: relative;
  background: radial-gradient(120% 90% at 50% 0%, rgba(120, 110, 255, 0.22), rgba(22, 27, 64, 0.55) 60%);
  border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -10px 20px -12px rgba(0, 0, 0, 0.5);
  text-shadow: 0 0 18px rgba(255, 210, 125, 0.55);
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s, opacity .5s; }
.cell.v0 { background: radial-gradient(120% 100% at 50% 0%, rgba(120, 110, 255, 0.18), rgba(20, 24, 58, 0.6) 65%); color: #f0cf8e; }
.cell.v1 { background: radial-gradient(120% 100% at 50% 0%, rgba(140, 120, 255, 0.28), rgba(26, 28, 70, 0.6) 65%); }
.cell.v2 { background: radial-gradient(120% 100% at 50% 0%, rgba(255, 190, 120, 0.22), rgba(40, 32, 80, 0.62) 65%); color: #ffdc95; text-shadow: 0 0 22px rgba(255, 210, 125, 0.8); border-color: rgba(255, 214, 140, 0.22); }
.cell:not(.used) { animation: glow 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes glow { 0%,100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 rgba(255, 210, 125, 0); } 50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 22px -8px rgba(255, 210, 125, 0.5); } }
.cell:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--line-hi); box-shadow: 0 10px 30px -10px rgba(255, 210, 125, 0.55); }
.cell:disabled { cursor: default; }
.cell.used { color: transparent; text-shadow: none; background: transparent; border-color: rgba(196, 204, 255, 0.05); box-shadow: none; animation: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.board { position: relative; }
.constellation { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.cell { z-index: 1; }
.cell.used { z-index: 0; }
.cl { stroke: rgba(255, 222, 170, 0.45); stroke-width: 1.3; stroke-linecap: round; }
.cl.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s cubic-bezier(.4,.1,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.st { transform-box: fill-box; transform-origin: center; }
.st .halo { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.st.pop { animation: pop .7s cubic-bezier(.3,.7,.3,1.4); }
@keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.7); opacity: 1; } 100% { transform: scale(1); } }
@keyframes tw { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .32; transform: scale(1.3); } }
.sky-card { width: 100%; max-width: 420px; border-radius: 22px; border: 1px solid var(--line); background: rgba(6, 9, 24, 0.55); padding: 12px 12px 14px; display: grid; gap: 6px; }
.sky-card svg { width: 100%; height: auto; display: block; overflow: visible; }
.sky-card .cname { font-family: var(--display); font-style: italic; font-size: 1.25rem; color: var(--gold); }
.sky-card .csub { font-size: 0.78rem; color: var(--muted); }
.cell.flip { animation: flip .6s cubic-bezier(.3,.7,.3,1); }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(1.05); } 100% { transform: rotateY(0); } }
.cell.pick { animation: pick 1s ease; }
@keyframes pick { 0%,100% { box-shadow: none; } 30%,70% { box-shadow: 0 0 30px -4px rgba(255, 210, 125, 0.8); border-color: var(--line-hi); transform: scale(1.05); } }
.board.locked .cell:not(.used) { cursor: wait; }
.progress { font-size: 0.8rem; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse at 50% 100%, rgba(6, 9, 24, 0.55), rgba(6, 9, 24, 0.82)); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); padding-inline: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); animation: fade .4s ease; }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 640px) { .sheet-wrap { align-items: center; } }
.sheet { width: 100%; max-width: 560px; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; animation: rise .55s cubic-bezier(.2,.8,.2,1);
  background: linear-gradient(180deg, rgba(40, 46, 104, 0.72), rgba(18, 22, 56, 0.82)); border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tag { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: var(--muted); }
.tag.lime { background: var(--gold); color: var(--gold-ink); box-shadow: 0 0 20px -4px rgba(255, 210, 125, 0.6); }
.q-text { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.timer { height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--violet), var(--gold)); transform-origin: left; box-shadow: 0 0 12px var(--gold); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 380px) { .opts { grid-template-columns: 1fr; } }
.opt { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; text-align: left; font-weight: 700; cursor: pointer; transition: background .2s, border-color .2s, transform .12s; position: relative; min-height: 56px; }
.opt:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.25); }
.opt:active:not(:disabled) { transform: scale(0.98); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: rgba(143, 240, 194, 0.14); box-shadow: 0 0 24px -8px var(--good); }
.opt.wrong { border-color: var(--bad); background: rgba(255, 145, 145, 0.1); }
.opt .by { position: absolute; top: -9px; right: 10px; font-size: 0.68rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; color: #0b0e22; }
.rivals { display: flex; gap: 6px; flex-wrap: wrap; }
.rival { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.06); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 0.78rem; color: var(--muted); }
.rival.hot { color: var(--fg); }
.status { font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
.wager { display: flex; flex-direction: column; gap: 10px; }
.wager output { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--gold); text-shadow: 0 0 24px rgba(255, 210, 125, 0.5); font-variant-numeric: tabular-nums; }
.wager input[type=range] { width: 100%; accent-color: var(--gold); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.final-rows { display: grid; gap: 8px; }
.final-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 8px 12px; font-variant-numeric: tabular-nums; }
.final-row .grow { flex: 1; min-width: 0; }
.final-row .mark { font-weight: 800; }

/* ---------- end ---------- */
.podium { display: grid; gap: 8px; width: 100%; max-width: 420px; }
.place { display: flex; align-items: center; gap: 12px; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.place.me { border-color: var(--line-hi); box-shadow: 0 0 24px -8px rgba(255, 210, 125, 0.5); }
.place .rank { font-family: var(--display); font-weight: 700; font-size: 1.5rem; width: 1.4em; color: var(--dim); }
.place .grow { flex: 1; min-width: 0; font-weight: 800; text-align: left; }
.place .pts { font-family: var(--display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.stat { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; max-width: 420px; }
.row .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: #0b0e22; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }

/* ---------- fireflies (Тэг and friends) ---------- */
.blob { overflow: visible; display: block; flex: none; filter: drop-shadow(0 0 10px var(--glow, rgba(220, 255, 126, 0.55))); }
.blob .bd { transform-origin: 50% 90%; transform-box: fill-box; }
.blob.idle .bd { animation: float 4.5s ease-in-out infinite; animation-delay: var(--fd, 0s); }
.blob.hop .bd { animation: hop .7s cubic-bezier(.3,.7,.3,1); }
.blob.shake .bd { animation: shake .5s ease; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5%) scale(1.02, .98); } }
@keyframes hop { 0%,100% { transform: none; } 30% { transform: scale(1.1,.88); } 55% { transform: translateY(-24%) scale(.94,1.08); } 80% { transform: scale(1.05,.95); } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-9%); } 50% { transform: translateX(8%); } 75% { transform: translateX(-4%); } }
.spark { position: fixed; pointer-events: none; z-index: 30; color: var(--gold); font-size: 14px; text-shadow: 0 0 10px var(--gold); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Созвездие</div>
    <div class="toggles">
      <button class="icon-btn" id="music" type="button" aria-pressed="true">♪ Музыка</button>
      <button class="icon-btn" id="sound" type="button" aria-pressed="true">Звуки</button>
    </div>
  </div>
  <main id="screen"></main>
</div>

<script>
(() => {
  // ------------------------------------------------------------------ data
  const THEMES = [
    { name: "Книги", qs: [
      { q: "Кто написал роман «Война и мир»?", a: ["Лев Толстой", "Фёдор Достоевский", "Антон Чехов", "Иван Тургенев"], ok: 0 },
      { q: "Как зовут главного героя «Преступления и наказания»?", a: ["Евгений Базаров", "Родион Раскольников", "Григорий Печорин", "Илья Обломов"], ok: 1 },
      { q: "Какой писатель придумал Шерлока Холмса?", a: ["Агата Кристи", "Эдгар По", "Артур Конан Дойл", "Чарльз Диккенс"], ok: 2 },
    ]},
    { name: "Кино", qs: [
      { q: "Какой фильм 1997 года получил 11 «Оскаров»?", a: ["«Аватар»", "«Титаник»", "«Терминатор 2»", "«Гладиатор»"], ok: 1 },
      { q: "Как зовут мага-наставника Фродо во «Властелине колец»?", a: ["Саруман", "Мерлин", "Дамблдор", "Гэндальф"], ok: 3 },
      { q: "Кто снял фильм «Брат» (1997)?", a: ["Алексей Балабанов", "Никита Михалков", "Андрей Звягинцев", "Фёдор Бондарчук"], ok: 0 },
    ]},
    { name: "Наука", qs: [
      { q: "Какая планета ближе всего к Солнцу?", a: ["Венера", "Марс", "Меркурий", "Земля"], ok: 2 },
      { q: "Какой химический символ у золота?", a: ["Ag", "Au", "Go", "Gd"], ok: 1 },
      { q: "Сколько костей в скелете взрослого человека?", a: ["186", "226", "256", "206"], ok: 3 },
    ]},
    { name: "Спорт", qs: [
      { q: "Сколько игроков одной команды на поле в футболе?", a: ["10", "11", "12", "9"], ok: 1 },
      { q: "Какая сборная выиграла чемпионат мира по футболу 2018 года?", a: ["Хорватия", "Бразилия", "Франция", "Бельгия"], ok: 2 },
      { q: "Сколько минут длится один период в хоккее?", a: ["20", "15", "25", "30"], ok: 0 },
    ]},
    { name: "Страны", qs: [
      { q: "Какой океан самый большой?", a: ["Атлантический", "Индийский", "Северный Ледовитый", "Тихий"], ok: 3 },
      { q: "Какой город — столица Австралии?", a: ["Сидней", "Канберра", "Мельбурн", "Перт"], ok: 1 },
      { q: "Какое озеро самое глубокое в мире?", a: ["Байкал", "Танганьика", "Каспийское море", "Виктория"], ok: 0 },
    ]},
  ];
  const VALUES = [100, 200, 300];
  const FINAL = { theme: "Космос", q: "В каком году человек впервые полетел в космос?", a: ["1957", "1961", "1965", "1969"], ok: 1 };
  const Q_TIME = 20000;

  const PLAYERS = [
    { id: "me", name: "Вы", color: "var(--firefly)", hex: "#dcff7e", bot: false },
    { id: "smart", name: "Умник", color: "var(--violet)", hex: "#ab9dff", bot: true, acc: 0.86, buzz: [5200, 9000], pickHigh: true, risk: 0.5 },
    { id: "rush", name: "Торопыга", color: "var(--rose)", hex: "#ff9db0", bot: true, acc: 0.6, buzz: [1800, 4200], pickHigh: false, risk: 0.9 },
  ];

  // ------------------------------------------------------------------ utils
  const $ = (s, el = document) => el.querySelector(s);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ------------------------------------------------------------------ the night sky
  const sky = $("#sky"), g2 = sky.getContext("2d");
  let W = 0, H = 0, stars = [], shooting = null, nextShoot = performance.now() + 4000, par = [0, 0], parT = [0, 0];
  function resizeSky() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 2400);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.9,
      r: Math.pow(Math.random(), 3) * 1.7 + 0.35,
      layer: Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2,
      ph: Math.random() * Math.PI * 2, sp: rnd(0.4, 1.6),
      warm: Math.random() < 0.14,
    }));
    if (reduce) drawSky(performance.now());
  }
  function horizon() {
    // Two layers of soft hills with a faint glow on the horizon line
    const base = H - Math.min(80, H * 0.09);
    const glow = g2.createLinearGradient(0, base - 60, 0, base + 10);
    glow.addColorStop(0, "rgba(255,170,120,0)"); glow.addColorStop(1, "rgba(255,170,120,0.07)");
    g2.fillStyle = glow; g2.fillRect(0, base - 60, W, 70);
    [["#0a0d24", 0, 14, 210], ["#060818", 18, 9, 120]].forEach(([c, off, amp, per]) => {
      g2.fillStyle = c;
      g2.beginPath(); g2.moveTo(0, H);
      for (let x = 0; x <= W + 10; x += 10) g2.lineTo(x, base + off + Math.sin(x / per + off) * amp + Math.sin(x / (per * 0.37)) * amp * 0.25);
      g2.lineTo(W, H); g2.closePath(); g2.fill();
    });
  }
  function drawSky(now) {
    const t = now / 1000;
    par[0] += (parT[0] - par[0]) * 0.04; par[1] += (parT[1] - par[1]) * 0.04;
    const bg = g2.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#04061a"); bg.addColorStop(0.55, "#0b1030"); bg.addColorStop(1, "#1b1640");
    g2.fillStyle = bg; g2.fillRect(0, 0, W, H);
    // slow nebulae
    g2.globalCompositeOperation = "lighter";
    [[0.2, 0.25, "rgba(110,90,255,0.10)", 0.07], [0.8, 0.4, "rgba(255,120,170,0.06)", 0.05], [0.5, 0.75, "rgba(80,140,255,0.07)", 0.04]].forEach(([fx, fy, c, s], i) => {
      const x = W * fx + Math.sin(t * s + i) * 60, y = H * fy + Math.cos(t * s * 0.8 + i) * 40, rad = Math.max(W, H) * 0.55;
      const gr = g2.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, c); gr.addColorStop(1, "rgba(0,0,0,0)");
      g2.fillStyle = gr; g2.fillRect(0, 0, W, H);
    });

    for (const s of stars) {
      const drift = [2, 5, 9][s.layer];
      let x = (s.x + t * drift + par[0] * (s.layer + 1) * 6) % (W + 4); if (x < -2) x += W + 4;
      const y = s.y + par[1] * (s.layer + 1) * 5;
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.ph + t * s.sp));
      g2.fillStyle = s.warm ? `rgba(255,214,150,${a})` : `rgba(235,238,255,${a})`;
      g2.beginPath(); g2.arc(x, y, s.r, 0, Math.PI * 2); g2.fill();
      if (s.r > 1.4) {
        const halo = g2.createRadialGradient(x, y, 0, x, y, s.r * 5);
        halo.addColorStop(0, s.warm ? `rgba(255,200,120,${a * 0.35})` : `rgba(200,210,255,${a * 0.35})`);
        halo.addColorStop(1, "rgba(0,0,0,0)");
        g2.fillStyle = halo; g2.beginPath(); g2.arc(x, y, s.r * 5, 0, Math.PI * 2); g2.fill();
      }
    }
    g2.globalCompositeOperation = "source-over";
    // shooting star
    if (!reduce && !shooting && now > nextShoot) shooting = { x: rnd(W * 0.1, W * 0.8), y: rnd(20, H * 0.35), vx: rnd(380, 560), vy: rnd(120, 220), born: now };
    if (shooting) {
      const k = (now - shooting.born) / 1000;
      const x = shooting.x + shooting.vx * k, y = shooting.y + shooting.vy * k;
      const life = 1 - k / 1.1;
      if (life <= 0) { shooting = null; nextShoot = now + rnd(6000, 14000); }
      else {
        const tail = g2.createLinearGradient(x, y, x - shooting.vx * 0.22, y - shooting.vy * 0.22);
        tail.addColorStop(0, `rgba(255,236,200,${life})`); tail.addColorStop(1, "rgba(255,236,200,0)");

  function skyLoop(now) { drawSky(now); requestAnimationFrame(skyLoop); }
  addEventListener("resize", resizeSky);
  addEventListener("pointermove", (e) => { parT = [(e.clientX / W - 0.5) * 2, (e.clientY / H - 0.5) * 2]; });
  resizeSky();
  if (!reduce) requestAnimationFrame(skyLoop);

  // ------------------------------------------------------------------ sound: soft chimes + a slow ambient pad
  let A = null, master, sfxBus, musicBus, musicTimer = null, chordIx = 0;
  let soundOn = store.get("tablo:sound") !== "0";
  let musicOn = store.get("tablo:music") !== "0";
  // D major pentatonic, the calm "star" scale
  const PENTA = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880, 987.77, 1174.66];
  function ensureAudio() {
    if (A) { if (A.state === "suspended") A.resume(); return; }
    try {
      A = new (window.AudioContext || window.webkitAudioContext)();
      master = A.createGain(); master.gain.value = 0.9; master.connect(A.destination);
      const verb = A.createConvolver();
      const len = A.sampleRate * 3.4, buf = A.createBuffer(2, len, A.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = buf;

  }
  function hum(freq, delay = 0, vel = 0.22, len = 1.4, glideTo = null) {

    o.type = "triangle"; o.frequency.setValueAtTime(freq, t);

  const sfx = {
    tap: () => chime(pick(PENTA.slice(5)), 0, 0.12, 1.4),
    open: () => { chime(PENTA[3], 0, 0.18); chime(PENTA[5], 0.12, 0.16); },
    right: () => [5, 6, 7, 10].forEach((n, i) => chime(PENTA[n], i * 0.1, 0.22)),
    wrong: () => { hum(220, 0, 0.18, 1.2, 185); hum(147, 0.1, 0.12, 1.4, 131); },
    buzz: () => chime(PENTA[8], 0, 0.1, 0.7),
    win: () => [3, 5, 6, 7, 8, 10].forEach((n, i) => chime(PENTA[n], i * 0.14, 0.24, 3)),
  };
  // Pad: Dmaj9 → Bm9 → Gmaj9 → A6/9, each chord ~9s, very soft
  const CHORDS = [[146.83, 220, 277.18, 329.63, 369.99], [123.47, 185, 220, 277.18, 329.63], [98, 196, 246.94, 293.66, 369.99], [110, 220, 277.18, 329.63, 369.99]];
  function playChord(ix) {
    if (!A) return;

  $("#music").addEventListener("click", () => { ensureAudio(); setMusic(!musicOn); });
  $("#sound").addEventListener("click", () => { ensureAudio(); setSound(!soundOn); sfx.tap(); });

  $("#sound").setAttribute("aria-pressed", soundOn);
  // The first tap anywhere unlocks audio and starts the music

  // ------------------------------------------------------------------ fireflies (Тэг and friends)
  let blobSeq = 0;
  const GLOW = { "var(--firefly)": "rgba(220,255,126,0.6)", "var(--violet)": "rgba(171,157,255,0.6)", "var(--rose)": "rgba(255,157,176,0.6)" };
  function blob(color, size = 40, id = "") {
    const uid = "b" + (++blobSeq);

      <g class="bd">
        <circle cx="50" cy="54" r="42" fill="${color}"></circle>
        <circle cx="50" cy="54" r="42" fill="#0b0e22" opacity=".25"></circle>
        <circle cx="50" cy="50" r="41" fill="${color}"></circle>
        <ellipse cx="36" cy="30" rx="12" ry="7" fill="#fff" opacity=".35"></ellipse>
        <g class="eyes">
          <g class="eye" transform="translate(36 50)"><ellipse class="o" rx="6.5" ry="10" fill="#0b0e22"></ellipse><path class="s" d="" stroke="#0b0e22" stroke-width="4" stroke-linecap="round" fill="none"></path></g>
          <g class="eye" transform="translate(64 50)"><ellipse class="o" rx="6.5" ry="10" fill="#0b0e22"></ellipse><path class="s" d="" stroke="#0b0e22" stroke-width="4" stroke-linecap="round" fill="none"></path></g>
        </g>
        <path class="m" d="" stroke="#0b0e22" stroke-width="4" stroke-linecap="round" fill="none"></path>

  }
  const MOOD = {
    idle: { eye: "o", ry: 10, m: "" },
    happy: { eye: "M-7 3 Q0 -7 7 3", m: "M40 70 q10 10 20 0" },
    sad: { eye: "o", ry: 7, dy: 3, m: "M41 76 q9 -7 18 0" },
    think: { eye: "o", ry: 9, look: [4, -4], m: "M44 72 l12 -2" },

  function setMood(svg, mood, look) {
    if (!svg) return;
    const M = MOOD[mood] || MOOD.idle;
    const gz = look || M.look || [0, 0];
    svg.querySelectorAll(".eye").forEach((e, i) => {
      const bx = i ? 64 : 36;
      e.setAttribute("transform", `translate(${bx + gz[0]} ${50 + gz[1] + (M.dy || 0)})`);

  }

    document.querySelectorAll(".blob").forEach((svg) => {

  // Golden sparks instead of confetti

      const p = document.createElement("span");
      p.className = "spark"; p.textContent = pick(["✦", "✧", "·", "✦"]);

  // ------------------------------------------------------------------ game state
  let S;
  function newGame() {
    const cells = [];
    THEMES.forEach((t, ti) => VALUES.forEach((v, vi) => cells.push({ ti, vi, value: v, used: false, special: false })));
    // Two hidden "Ставка" cells, never both in the same theme

  const screen = $("#screen");

  // ------------------------------------------------------------------ start screen

  }

  // ------------------------------------------------------------------ game screen
  function renderGame() {
    $("#app").classList.remove("on-start");

      <div class="scores" id="scores">

  }
  const cellAt = (ti, vi) => S.cells.find((c) => c.ti === ti && c.vi === vi);
  const player = (id) => PLAYERS.find((p) => p.id === id);

  function paintBoard() {
    S.cells.forEach((c) => {
      const b = $(`.cell[data-ti="${c.ti}"][data-vi="${c.vi}"]`);

  function say(text, mood = "idle") {

  function addScore(id, delta) {
    S.scores[id] += delta;
    const card = $("#pl-" + id);
    if (card) {
      const d = document.createElement("span");
      d.className = "delta " + (delta >= 0 ? "up" : "down");
      d.textContent = (delta >= 0 ? "+" : "") + delta;
      card.appendChild(d);
      if (!reduce) d.animate([{ transform: "translateY(4px)", opacity: 0 }, { transform: "translateY(-6px)", opacity: 1, offset: 0.3 }, { transform: "translateY(-14px)", opacity: 0 }], { duration: 1300 }).onfinish = () => d.remove();
      else setTimeout(() => d.remove(), 1300);
    }
    paintBoard();
  }

  // ------------------------------------------------------------------ bots choose a cell
  async function botTurn() {
    const bot = player(S.turn);
    if (!bot || !bot.bot) return;
    S.busy = true;
    say(`${bot.name} выбирает…`, "think");
    setMood($("#av-" + bot.id), "think");
    await sleep(1100);
    const free = S.cells.filter((c) => !c.used);
    const c = bot.pickHigh ? free.sort((a, b) => b.value - a.value)[0] : pick(free);
    const b = $(`.cell[data-ti="${c.ti}"][data-vi="${c.vi}"]`);
    b.classList.add("pick");
    say(`${bot.name}: «${THEMES[c.ti].name} за ${c.value}»`);
    await sleep(900);
    b.classList.remove("pick");
    S.busy = false;
    openCell(c, bot.id);
  }

  function nextTurn() {
    paintBoard();
    if (S.cells.every((c) => c.used)) return startFinal();
    if (S.turn === "me") { say(pick(["Ваш ход! Выбирайте клетку.", "Ваш ход: зажгите звезду.", "Выбирайте тему!"])); }
    else botTurn();
  }

  // ------------------------------------------------------------------ opening a cell
  async function openCell(cell, chooser) {
    cell.used = true;
    S.path.push({ ti: cell.ti, vi: cell.vi, who: null });
    paintBoard();
    const flipEl = $(`.cell[data-ti="${cell.ti}"][data-vi="${cell.vi}"]`);
    if (flipEl && !reduce) { flipEl.classList.add("flip"); setTimeout(() => flipEl.classList.remove("flip"), 650); }
    const Q = THEMES[cell.ti].qs[cell.vi];
    sfx.open();
    if (cell.special) {
      say(`Ставка! Отвечает только ${chooser === "me" ? "тот, кто выбрал — то есть вы" : player(chooser).name}.`, "wow");
      animate($("#host-blob"), "hop");
      await sleep(700);
      const max = Math.max(S.scores[chooser], 500);
      let wager;
      if (chooser === "me") wager = await askWager(`Ставка · ${THEMES[cell.ti].name}`, max, 100);
      else {
        const b = player(chooser);
        wager = Math.max(100, Math.round((max * rnd(0.3, 1) * b.risk) / 100) * 100);
        say(`${b.name} ставит ${wager}.`, "think");
        await sleep(1100);
      }
      return question({ cell, Q, value: wager, only: chooser, label: `Ставка · ${wager}` });
    }
    question({ cell, Q, value: cell.value, only: null, label: `${THEMES[cell.ti].name} · ${cell.value}` });
  }

  // ------------------------------------------------------------------ a question round
  function question({ cell, Q, value, only, label }) {
    const eligible = only ? [only] : PLAYERS.map((p) => p.id);
    const locked = new Set();
    let open = true, pending = false, t0 = performance.now(), raf, timers = [];

    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Вопрос">
        <div class="q-head"><span class="tag ${only ? "lime" : ""}">${label}</span><span class="rivals" id="rv"></span></div>
        <p class="q-text">${Q.q}</p>
        <div class="timer"><i id="bar"></i></div>
        <div class="opts">${Q.a.map((a, i) => `<button class="opt" type="button" data-i="${i}">${a}</button>`).join("")}</div>
        <div class="status" id="st">${only && only !== "me" ? `Отвечает ${player(only).name}…` : only === "me" ? "Отвечаете только вы." : "Отвечайте быстрее соперников!"}</div>
      </div>`;
    document.body.appendChild(wrap);
    const rv = $("#rv", wrap), st = $("#st", wrap), bar = $("#bar", wrap);
    const optBtns = [...wrap.querySelectorAll(".opt")];
    rv.innerHTML = PLAYERS.filter((p) => p.bot && eligible.includes(p.id)).map((p) => `<span class="rival" id="rv-${p.id}">${blob(p.color, 22, "rb-" + p.id)}<span>думает</span></span>`).join("");
    PLAYERS.filter((p) => p.bot).forEach((p) => setMood($("#rb-" + p.id, wrap), "think"));
    if (!eligible.includes("me")) optBtns.forEach((b) => (b.disabled = true));
    optBtns[0].focus({ preventScroll: true });

    function tickBar(now) {
      const k = Math.max(0, 1 - (now - t0) / Q_TIME);
      bar.style.transform = `scaleX(${k})`;
      bar.style.background = k < 0.25 ? "var(--bad)" : "";
      if (k <= 0) return finish(null);
      if (open) raf = requestAnimationFrame(tickBar);
    }
    raf = requestAnimationFrame(tickBar);

    // Bots buzz in at their own pace
    PLAYERS.filter((p) => p.bot && eligible.includes(p.id)).forEach((b) => {
      const at = only ? rnd(2200, 4200) : rnd(b.buzz[0], b.buzz[1]) * (1 + cell.vi * 0.12);
      timers.push(setTimeout(() => botAnswer(b), at));
    });

    async function botAnswer(b) {
      if (!open || locked.has(b.id)) return;
      if (pending) { timers.push(setTimeout(() => botAnswer(b), 700)); return; }
      pending = true;
      sfx.buzz();
      const chip = $("#rv-" + b.id, wrap);
      if (chip) { chip.classList.add("hot"); chip.querySelector("span:last-child").textContent = "жмёт!"; }
      setMood($("#rb-" + b.id, wrap), "wow");
      st.textContent = `${b.name} нажал кнопку…`;
      optBtns.forEach((x) => (x.disabled = true));
      await sleep(850);
      const acc = b.acc - cell.vi * 0.1;
      const wrongs = [0, 1, 2, 3].filter((i) => i !== Q.ok && !optBtns[i].classList.contains("wrong"));
      const idx = Math.random() < acc ? Q.ok : pick(wrongs);
      pending = false;
      resolve(b.id, idx);
    }

    optBtns.forEach((btn) => btn.addEventListener("click", () => {
      if (!open || pending || locked.has("me") || !eligible.includes("me")) return;
      resolve("me", +btn.dataset.i);
    }));

    function resolve(id, idx) {
      if (!open) return;
      const p = player(id), btn = optBtns[idx];
      const tagEl = document.createElement("span");
      tagEl.className = "by"; tagEl.textContent = p.name; tagEl.style.background = p.hex;
      btn.appendChild(tagEl);
      if (idx === Q.ok) {
        btn.classList.add("right");
        sfx.right();
        addScore(id, value);
        if (id === "me") { S.rightCount++; S.log.push("right"); const r = btn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top); }
        animate($("#av-" + id), "hop"); setMood($("#av-" + id), "happy"); setTimeout(() => setMood($("#av-" + id), "idle"), 1500);
        st.textContent = id === "me" ? `Верно! +${value}` : `${p.name} отвечает верно: +${value}`;
        S.turn = id;
        return finish(id);
      }
      btn.classList.add("wrong");
      sfx.wrong();
      addScore(id, -value);
      if (id === "me") S.log.push("wrong");
      animate($("#av-" + id), "shake"); setMood($("#av-" + id), "sad"); setTimeout(() => setMood($("#av-" + id), "idle"), 1500);
      locked.add(id);
      const chip = $("#rv-" + id, wrap);
      if (chip) { chip.querySelector("span:last-child").textContent = "мимо"; setMood($("#rb-" + id, wrap), "sad"); }
      const left = eligible.filter((e) => !locked.has(e));
      if (!left.length) return finish(null);
      st.textContent = `${p.name} ошибся (−${value}). Остальные ещё могут ответить.`;
      optBtns.forEach((x) => (x.disabled = x.classList.contains("wrong") || !left.includes("me")));
    }

    async function finish(winner) {
      if (!open) return;
      open = false;
      cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
      optBtns.forEach((x) => (x.disabled = true));
      if (!winner) {
        optBtns[Q.ok].classList.add("right");
        if (eligible.includes("me") && !locked.has("me")) S.log.push("skip");
        st.textContent = `Правильный ответ: ${Q.a[Q.ok]}.`;
      }
      if (eligible.includes("me")) S.answered++;
      const entry = S.path[S.path.length - 1];
      if (entry) entry.who = winner || "none";
      await sleep(winner ? 1500 : 2100);
      wrap.remove();
      drawConstellation(true);
      if (winner === "me") say(pick(["Красиво!", "Вот это знания!", "Есть! Очки ваши."]), "happy");
      else if (winner) say(`${player(winner).name} забирает очки и выбирает дальше.`, "sad");
      else say("Никто не угадал. Ход остаётся у того, кто выбирал.", "idle");
      await sleep(900);
      nextTurn();
    }
  }

  // ------------------------------------------------------------------ wager sheet
  function askWager(title, max, min) {
    return new Promise((done) => {
      const wrap = document.createElement("div");
      wrap.className = "sheet-wrap";
      const start = Math.min(max, Math.max(min, Math.round(max / 2 / 100) * 100));
      wrap.innerHTML = `
        <div class="sheet" role="dialog" aria-modal="true" aria-label="Ставка">
          <div class="q-head"><span class="tag lime">${title}</span></div>
          <p class="q-text">Сколько ставите на свой ответ?</p>
          <div class="wager">
            <output id="wv">${start}</output>
            <input type="range" id="wr" min="${min}" max="${max}" step="100" value="${start}" aria-label="Размер ставки">
            <div class="chips">
              <button class="chip" type="button" data-v="${min}">Минимум</button>
              <button class="chip" type="button" data-v="${Math.round(max / 2 / 100) * 100 || min}">Половина</button>
              <button class="chip" type="button" data-v="${max}">Ва-банк · ${max}</button>
            </div>
          </div>
          <button class="btn" id="wok" type="button">Ставлю</button>
        </div>`;
      document.body.appendChild(wrap);
      const r = $("#wr", wrap), out = $("#wv", wrap);
      r.addEventListener("input", () => { out.textContent = r.value; sfx.tap(); });
      wrap.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { r.value = c.dataset.v; out.textContent = r.value; sfx.tap(); }));
      $("#wok", wrap).addEventListener("click", () => { sfx.open(); wrap.remove(); done(+r.value); });
      r.focus();
    });
  }

  // ------------------------------------------------------------------ final round
  async function startFinal() {
    say("Все клетки открыты. Финал! Каждый ставит часть своих очков на один вопрос.", "wow");
    animate($("#host-blob"), "hop");
    await sleep(1400);
    const myMax = Math.max(0, S.scores.me);
    const myWager = myMax > 0 ? await askWager(`Финал · ${FINAL.theme}`, myMax, 0) : 0;
    const botW = {};
    PLAYERS.filter((p) => p.bot).forEach((b) => {
      const s = Math.max(0, S.scores[b.id]);
      const behind = S.scores.me > S.scores[b.id];
      botW[b.id] = Math.round((s * (behind ? rnd(0.7, 1) : rnd(0.2, 0.6) * b.risk)) / 100) * 100;
    });

    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Финальный вопрос">
        <div class="q-head"><span class="tag lime">Финал · ${FINAL.theme}</span><span class="tag">ваша ставка ${myWager}</span></div>
        <p class="q-text">${FINAL.q}</p>
        <div class="timer"><i id="fbar"></i></div>
        <div class="opts">${FINAL.a.map((a, i) => `<button class="opt" type="button" data-i="${i}">${a}</button>`).join("")}</div>
        <div class="status" id="fst">Соперники уже ответили. Ваш выбор?</div>
        <div class="final-rows" id="frows" hidden></div>
        <button class="btn" id="fdone" type="button" hidden>Итоги</button>
      </div>`;
    document.body.appendChild(wrap);
    const opts = [...wrap.querySelectorAll(".opt")], bar = $("#fbar", wrap);
    let open = true, t0 = performance.now();
    const loop = (now) => {
      const k = Math.max(0, 1 - (now - t0) / 20000);
      bar.style.transform = `scaleX(${k})`;
      if (k <= 0) return reveal(null);
      if (open) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    opts.forEach((b) => b.addEventListener("click", () => reveal(+b.dataset.i)));

    async function reveal(myIdx) {
      if (!open) return;
      open = false;
      opts.forEach((b) => (b.disabled = true));
      if (myIdx !== null) opts[myIdx].classList.add(myIdx === FINAL.ok ? "right" : "wrong");
      opts[FINAL.ok].classList.add("right");
      const results = [{ id: "me", ok: myIdx === FINAL.ok, w: myWager }];
      PLAYERS.filter((p) => p.bot).forEach((b) => results.push({ id: b.id, ok: Math.random() < b.acc - 0.1, w: botW[b.id] }));
      S.log.push(myIdx === FINAL.ok ? "right" : myIdx === null ? "skip" : "wrong");
      if (myIdx === FINAL.ok) S.rightCount++;
      S.answered++;
      const rows = $("#frows", wrap);
      rows.hidden = false;
      $("#fst", wrap).textContent = `Правильный ответ: ${FINAL.a[FINAL.ok]} — полёт Юрия Гагарина.`;
      for (const r of results) {
        await sleep(650);
        const p = player(r.id);
        const delta = r.ok ? r.w : -r.w;
        rows.insertAdjacentHTML("beforeend", `<div class="final-row">${blob(p.color, 26)}<span class="grow">${p.name} · ставка ${r.w}</span><span class="mark" style="color:${r.ok ? "var(--good)" : "var(--bad)"}">${r.ok ? "+" : "−"}${r.w}</span></div>`);
        (r.ok ? sfx.right : sfx.wrong)();
        addScore(r.id, delta);
      }
      const done = $("#fdone", wrap);
      done.hidden = false; done.focus();
      done.addEventListener("click", () => { wrap.remove(); renderEnd(); });
    }
  }

  // ------------------------------------------------------------------ end screen
  function renderEnd() {
    $("#app").classList.remove("on-start");
    const ranking = PLAYERS.map((p) => ({ ...p, pts: S.scores[p.id] })).sort((a, b) => b.pts - a.pts);
    const place = ranking.findIndex((p) => p.id === "me") + 1;
    const best = Math.max(+(store.get("tablo:best") || 0), S.scores.me);
    store.set("tablo:best", String(best));
    const acc = S.answered ? Math.round((S.rightCount / S.answered) * 100) : 0;
    const titles = ["Победа!", "Второе место", "Третье место"];
    const lines = ["Вы обыграли и Умника, и Торопыгу. Настоящий эрудит.", "Почти! Ещё пара верных ответов — и табло ваше.", "Бывает. Реванш?"];
    screen.innerHTML = `
      <section class="start" style="justify-content:flex-start">
        ${blob("var(--firefly)", 96, "host-blob")}
        <h1>${titles[place - 1]}</h1>
        <p>${lines[place - 1]}</p>
        ${constellationCard()}
        <div class="podium" style="width:100%;max-width:420px">
          ${ranking.map((p, i) => `<div class="place ${p.id === "me" ? "me" : ""}"><span class="rank">${i + 1}</span>${blob(p.color, 30)}<span class="grow">${p.name}</span><span class="pts">${p.pts}</span></div>`).join("")}
        </div>
        <div class="stats" style="width:100%;max-width:420px">
          <div class="stat"><b>${S.rightCount}/${S.answered}</b><span>верных</span></div>
          <div class="stat"><b>${acc}%</b><span>точность</span></div>
          <div class="stat"><b>${best}</b><span>рекорд</span></div>
        </div>
        <div class="row" style="width:100%;max-width:420px">
          <button class="btn ghost" id="share" type="button">Поделиться</button>
          <button class="btn" id="again" type="button">Реванш</button>
        </div>
      </section>`;
    const host = $("#host-blob");
    if (place === 1) { setMood(host, "happy"); animate(host, "hop"); sfx.win(); const r = host.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + 20); }
    else setMood(host, place === 2 ? "idle" : "sad");
    $("#again").addEventListener("click", () => { sfx.open(); newGame(); renderGame(); say("Реванш! Вы снова начинаете.", "happy"); });
    $("#share").addEventListener("click", async () => {
      const grid = S.log.map((r) => (r === "right" ? "🟩" : r === "wrong" ? "🟥" : "⬜")).join("");
      const text = `✦ Созвездие ${constellationName()}\n${place === 1 ? "🏆 Победа" : place + "-е место"} · ${S.scores.me} очков\n${grid}\nСыграй: tag.bet`;
      try { await navigator.clipboard.writeText(text); toast("Скопировано — отправьте друзьям"); }
      catch { toast(text.replace(/\n/g, " · ")); }
    });
  }


  // ------------------------------------------------------------------ the constellation
  // Each new star links to the nearest star already lit, like a real constellation
  const nearest = (pts, i) => { let best = 0, bd = Infinity; for (let j = 0; j < i; j++) { const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y); if (d < bd) { bd = d; best = j; } } return pts[best]; };
  // Stable pseudo-random offset (−0.28…0.28 of a cell) so the figure looks like a real constellation
  const scatter = (p) => {
    const h = (a) => { const x = Math.sin(a * 12.9898 + (S.seed || 1) * 78.233) * 43758.5453; return x - Math.floor(x); };
    return [(h(p.ti * 5 + p.vi + 1) - 0.5) * 0.56, (h(p.ti * 3 + p.vi * 11 + 7) - 0.5) * 0.5];
  };
  const starColor = (who) => (!who || who === "none" ? "rgba(225,230,255,0.6)" : player(who).hex);
  function drawConstellation(animateLast) {
    const svg = $("#const"), board = $("#board");
    if (!svg || !board) return;
    const br = board.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${br.width} ${br.height}`);
    const pts = S.path.filter((p) => p.who).map((p) => {
      const c = $(`.cell[data-ti="${p.ti}"][data-vi="${p.vi}"]`).getBoundingClientRect();
      const [jx, jy] = scatter(p);
      return { x: c.left - br.left + c.width * (0.5 + jx), y: c.top - br.top + c.height * (0.5 + jy), who: p.who };
    });
    let html = "";
    for (let i = 1; i < pts.length; i++) {
      const a = nearest(pts, i), b = pts[i], len = Math.hypot(b.x - a.x, b.y - a.y);
      const anim = animateLast && i === pts.length - 1 && !reduce;
      html += `<line class="cl ${anim ? "draw" : ""}" style="--len:${len.toFixed(1)}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`;
    }
    pts.forEach((p, i) => {
      const anim = animateLast && i === pts.length - 1 && !reduce;
      html += `<g class="st ${anim ? "pop" : ""}" style="color:${starColor(p.who)}"><circle class="halo" cx="${p.x}" cy="${p.y}" r="11" fill="currentColor" opacity=".2"></circle><circle cx="${p.x}" cy="${p.y}" r="3.4" fill="currentColor"></circle></g>`;
    });
    svg.innerHTML = html;
  }
  addEventListener("resize", () => drawConstellation(false));

  const ADJ = ["Смелого", "Тихого", "Золотого", "Любопытного", "Быстрого", "Спящего", "Мудрого", "Далёкого"];
  const NOUN = ["Филина", "Кита", "Лиса", "Маяка", "Светлячка", "Тэга", "Дракона", "Путника"];
  function constellationName() {
    const seed = S.path.reduce((h, p) => (h * 31 + p.ti * 7 + p.vi * 3 + (p.who || "").length) >>> 0, 7);
    return `${ADJ[seed % ADJ.length]} ${NOUN[Math.floor(seed / 8) % NOUN.length]}`;
  }
  function constellationCard() {
    const Wd = 500, Hd = 280;
    const pts = S.path.filter((p) => p.who).map((p) => {
      const [jx, jy] = scatter(p);
      return { x: 50 + p.ti * 100 + jx * 100, y: 50 + p.vi * 90 + jy * 90, who: p.who };
    });
    let html = "";
    for (let i = 1; i < pts.length; i++) { const a = nearest(pts, i); html += `<line class="cl" x1="${a.x}" y1="${a.y}" x2="${pts[i].x}" y2="${pts[i].y}"></line>`; }
    pts.forEach((p) => { html += `<g class="st" style="color:${starColor(p.who)}"><circle class="halo" cx="${p.x}" cy="${p.y}" r="12" fill="currentColor" opacity=".2"></circle><circle cx="${p.x}" cy="${p.y}" r="4" fill="currentColor"></circle></g>`; });
    const mine = S.path.filter((p) => p.who === "me").length;
    return `<div class="sky-card"><svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Созвездие этой партии">${html}</svg>
      <div class="cname">Созвездие ${constellationName()}</div>
      <div class="csub">Ваших звёзд: ${mine} из ${pts.length}</div></div>`;
  }
  renderStart();
})();
</script>
